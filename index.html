<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Game-show look, single dark theme (it's going on a TV). Host = big TV layout; players = thumb-sized answer pad. */
:root{
  --bg:#0E1016; --surface:#181B24; --soft:#20242F; --ink:#F1F2F6; --muted:#9BA1B4; --line:#2C3140;
  --accent:#FFC23D; --accent-ink:#14161D; --good:#3DC98A; --bad:#FF6E6E;
  --a:#D9482A; --b:#2A60D4; --c:#13814F; --d:#7642C7;
  --display:'Archivo Black','Arial Black',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding:calc(env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:18px}
.tv{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(12px,2.2vw,28px);padding-top:clamp(12px,2vw,28px)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img,canvas{max-width:100%}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.bulb{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-family:var(--display);color:var(--accent-ink);font-size:18px;box-shadow:0 0 0 4px rgba(255,194,61,.25)}
.brand h1{font-size:20px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink)}
textarea{font-size:14px;min-height:110px;font-family:var(--mono);resize:vertical}
.codein{font-family:var(--mono)!important;font-size:24px!important;letter-spacing:.4em;text-transform:uppercase;text-align:center}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg)}
.btn.hot{background:var(--accent);color:var(--accent-ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:0}
.hint{color:var(--muted);font-size:14px;margin:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.tag.you,.tag.win{background:var(--accent);color:var(--accent-ink)}
.tag.out{background:rgba(255,110,110,.18);color:var(--bad)}

/* code tiles */
.tiles{display:flex;gap:clamp(6px,1vw,12px)}
.tile{width:clamp(52px,7vw,92px);aspect-ratio:4/5;border-radius:8px;background:#05060A;color:var(--accent);font-family:var(--mono);font-weight:700;font-size:clamp(34px,5vw,64px);display:grid;place-items:center;position:relative;border:1px solid var(--line)}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(14,16,22,.7)}

/* lobby (TV) */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(14px,2.5vw,32px);align-items:start}
.joinbox{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.joinrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:10px;border-radius:12px;line-height:0}
.qr img,.qr canvas{width:clamp(120px,14vw,190px)!important;height:auto!important}
.url{font-family:var(--mono);font-size:clamp(13px,1.4vw,18px);word-break:break-all;color:var(--ink)}
.pgrid{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 14px;font-weight:700;font-size:clamp(14px,1.5vw,19px);max-width:100%;min-width:0}
.pchip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.off{opacity:.45}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:0 6px;line-height:1}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;font-size:12px;font-weight:700;padding:3px 10px}
.pick[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode b{font-family:var(--display);font-weight:400;font-size:16px}
.mode span{font-size:13px;color:var(--muted)}
.mode[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:15px;background:none;border:0;padding:4px 0;text-align:left;width:100%}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .15s}
.toggle[aria-pressed=true] .sw{background:var(--good)}
.toggle[aria-pressed=true] .sw::after{transform:translateX(18px)}
details summary{cursor:pointer;font-weight:700;font-size:15px}

/* question (TV) */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-family:var(--display);font-size:clamp(15px,2vw,26px)}
.timer{display:flex;align-items:center;gap:12px}
.track{flex:1;height:clamp(10px,1.2vw,16px);border-radius:99px;background:var(--line);overflow:hidden}
.bar{height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .1s linear}
.bar.low{background:var(--bad)}
.secs{font-family:var(--mono);font-weight:700;font-size:clamp(22px,3vw,44px);min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.qtext{font-family:var(--display);font-size:clamp(24px,4.4vw,60px);line-height:1.15;margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,18px)}
.opt{border:0;border-radius:14px;padding:clamp(14px,1.8vw,26px);min-height:clamp(84px,11vw,150px);color:#fff;font-weight:700;font-size:clamp(17px,2.4vw,34px);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0;overflow-wrap:anywhere;transition:transform .08s,opacity .2s}
.opt:active:not(:disabled){transform:scale(.97)}
.opt .lt{font-family:var(--mono);font-size:.55em;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.o0{background:var(--a)}.o1{background:var(--b)}.o2{background:var(--c)}.o3{background:var(--d)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.3}
.opt.mine{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--ink)}
.opt.right{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--good)}
.opt .who{font-size:.5em;font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dot{font-size:clamp(13px,1.3vw,17px);font-weight:600;padding:4px 12px;border-radius:99px;border:1.5px dashed var(--line);color:var(--muted)}
.dot.in{border-style:solid;border-color:var(--accent);color:var(--ink)}
.status{text-align:center;font-weight:700;font-size:17px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

/* reveal / results */
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(14px,2.5vw,32px);align-items:start}
.events{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.events li{font-weight:700;padding:10px 14px;border-radius:10px;background:rgba(255,194,61,.16);font-size:clamp(15px,1.6vw,20px)}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:clamp(15px,1.6vw,21px)}
.board td{padding:10px 6px;border-bottom:1px solid var(--line)}
.board .rk{font-family:var(--mono);color:var(--muted);width:2.2em}
.board .sc{text-align:right;font-family:var(--mono);font-weight:700;white-space:nowrap}
.board .dl{text-align:right;font-family:var(--mono);font-size:.8em;color:var(--good);width:4.5em}
.board .nmc{font-weight:700;max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board tr.isout td{opacity:.5}
.winner{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:clamp(20px,3vw,40px) 16px;border-radius:18px;background:#05060A;border:1px solid var(--line);color:var(--accent)}
.winner h2{font-size:clamp(30px,7vw,84px);overflow-wrap:anywhere}
.verdict{text-align:center;display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.verdict .big{font-family:var(--display);font-size:36px;line-height:1.1}
.verdict.good .big{color:var(--good)}
.verdict.bad .big{color:var(--bad)}
.rankline{font-family:var(--display);font-size:22px;text-align:center}

/* player pad */
.pad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad .opt{min-height:120px;font-size:18px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.conn.warn::before{background:var(--bad)}

/* host dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .info{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.dock .info b{color:var(--ink)}
.dock .btn{flex:none;padding:12px 16px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
/* language switch + second-language lines */
.topr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.langsw{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.langsw button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:6px 12px;letter-spacing:.04em}
.langsw button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.qalt{margin:-4px 0 0;font-size:clamp(16px,2.4vw,30px);font-weight:600;color:var(--muted);text-wrap:balance}
.opt .alt{font-size:.68em;font-weight:600;opacity:.85}
.events li .alt{display:block;font-weight:600;opacity:.75;font-size:.9em}
.hint.alt{opacity:.8;font-style:italic}
.tv.bi{gap:clamp(8px,1.4vw,18px)}
.tv.bi .qtext{font-size:clamp(22px,3.3vw,44px)}
.tv.bi .qalt{font-size:clamp(15px,2vw,26px)}
.tv.bi .opt{min-height:clamp(64px,8vw,112px);padding:clamp(10px,1.3vw,18px);font-size:clamp(16px,2.1vw,28px);gap:4px}
@media (max-width:760px){.lobby,.split{grid-template-columns:1fr}}
@media (max-width:380px){.opt{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
// Optional extras, each tried from several sites. The game works without them:
// PeerJS = faster direct phone-to-phone link, qrcodejs = QR code in the lobby.
(function(){
  function load(urls,test,done){
    if(test())return done&&done();
    const u=urls.shift();if(!u)return;
    const sc=document.createElement("script");sc.src=u;sc.async=true;
    sc.onload=()=>test()?(done&&done()):load(urls,test,done);
    sc.onerror=()=>load(urls,test,done);
    document.head.appendChild(sc);
  }
  window.__extras={peer:false,qr:false};
  load(["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js","https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"],
    ()=>typeof window.Peer==="function",()=>{window.__extras.peer=true;window.dispatchEvent(new Event("extras"))});
  load(["https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js","https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js","https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"],
    ()=>typeof window.QRCode==="function",()=>{window.__extras.qr=true;window.dispatchEvent(new Event("extras"))});
})();
</script>

["History","Who was the first person to walk on the moon?|Neil Armstrong|Buzz Aldrin|Yuri Gagarin|John Glenn","Qui a été la première personne à marcher sur la Lune?|Neil Armstrong|Buzz Aldrin|Youri Gagarine|John Glenn"],

const BROKERS=["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt"],TOPIC="officequiznight26/";
// Tiny MQTT 3.1.1 client over the browser's own WebSocket (QoS 0 only), so no outside script is needed.
function MiniMqtt(url){
  const enc=new TextEncoder(),dec=new TextDecoder(),h={},self={connected:false,closed:false,subs:[],ws:null};
  self.on=(ev,f)=>{(h[ev]=h[ev]||[]).push(f);return self};
  const emit=(ev,...a)=>(h[ev]||[]).forEach(f=>{try{f(...a)}catch(e){}});
  const cat=parts=>{let n=0;parts.forEach(p=>n+=p.length);const o=new Uint8Array(n);let i=0;parts.forEach(p=>{o.set(p,i);i+=p.length});return o};
  const vlen=n=>{const o=[];do{let x=n%128;n=Math.floor(n/128);if(n>0)x|=128;o.push(x)}while(n>0);return new Uint8Array(o)};
  const mstr=x=>{const b=enc.encode(x);return cat([new Uint8Array([b.length>>8,b.length&255]),b])};
  const pkt=(first,body)=>cat([new Uint8Array([first]),vlen(body.length),body]);
  let pid=1,ping=null,retry=null,ackT=null;
  function send(p){try{if(self.ws&&self.ws.readyState===1)self.ws.send(p)}catch(e){}}
  function sub(topic){const id=(pid++%65535)+1;send(pkt(0x82,cat([new Uint8Array([id>>8,id&255]),mstr(topic),new Uint8Array([0])])))}
  function schedule(){if(self.closed)return;clearTimeout(retry);retry=setTimeout(open,4000)}
  function open(){
    if(self.closed)return;
    let ws;try{ws=new WebSocket(url,["mqtt"])}catch(e){schedule();return}
    self.ws=ws;ws.binaryType="arraybuffer";let buf=new Uint8Array(0);
    ws.onopen=()=>{
      const cid="oqn_"+Math.random().toString(36).slice(2,12);
      send(pkt(0x10,cat([mstr("MQTT"),new Uint8Array([4,0x02,0,30]),mstr(cid)]))); // MQTT 3.1.1, clean session, keepalive 30 s
      clearTimeout(ackT);ackT=setTimeout(()=>{if(!self.connected)try{ws.close()}catch(e){}},10000);
    };
    ws.onmessage=ev=>{
      if(typeof ev.data==="string")return;
      buf=cat([buf,new Uint8Array(ev.data)]);
      for(;;){
        if(buf.length<2)return;
        let mult=1,len=0,i=1,x;
        do{if(i>=buf.length)return;x=buf[i++];len+=(x&127)*mult;mult*=128}while(x&128);
        if(buf.length<i+len)return;
        const first=buf[0],type=first>>4,body=buf.slice(i,i+len);buf=buf.slice(i+len);
        if(type===2){ // CONNACK
          clearTimeout(ackT);
          if(body[1]===0){self.connected=true;self.subs.forEach(sub);clearInterval(ping);ping=setInterval(()=>send(new Uint8Array([0xC0,0])),20000);emit("connect")}
          else try{ws.close()}catch(e){}
        }else if(type===3){ // PUBLISH
          const tl=(body[0]<<8)|body[1],qos=(first>>1)&3,topic=dec.decode(body.slice(2,2+tl));
          let p=2+tl;if(qos>0){const mid=[body[p],body[p+1]];p+=2;if(qos===1)send(new Uint8Array([0x40,2,mid[0],mid[1]]))}
          emit("message",topic,dec.decode(body.slice(p)));
        }
      }
    };
    ws.onclose=()=>{const was=self.connected;self.connected=false;clearInterval(ping);clearTimeout(ackT);if(was)emit("close");schedule()};
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }
  self.subscribe=topic=>{if(!self.subs.includes(topic))self.subs.push(topic);if(self.connected)sub(topic)};
  self.publish=(topic,text)=>{if(self.connected)send(pkt(0x30,cat([mstr(topic),enc.encode(text)])))};
  self.end=()=>{self.closed=true;clearInterval(ping);clearTimeout(retry);clearTimeout(ackT);if(self.connected)send(new Uint8Array([0xE0,0]));try{self.ws&&self.ws.close()}catch(e){}};
  open();return self;
}
function relayConnect(subTopics,onMsg){
  if(typeof WebSocket!=="function")return[];
  return (window.__RELAYS||BROKERS).map(url=>{
    const c=MiniMqtt(url);
    subTopics.forEach(tp=>c.subscribe(tp));
    c.on("message",(tp,text)=>{let d;try{d=JSON.parse(text)}catch(e){return}onMsg(d,tp)});
    return c;
  });
}
function relayPub(list,topic,obj){const s=JSON.stringify(obj);list.forEach(c=>{try{if(c.connected)c.publish(topic,s)}catch(e){}})}

const OTDB_MAP={"General":["General Knowledge"],"Science":["Science & Nature","Science: Computers","Science: Mathematics","Science: Gadgets","Animals"],"Geography":["Geography"],"History":["History","Politics","Mythology"],"Sports":["Sports","Vehicles"],"Screen & Music":["Entertainment: Film","Entertainment: Music","Entertainment: Television","Entertainment: Video Games","Entertainment: Books","Celebrities"]};

async function fetchOnline(cats,diff,need){
  const allowed=new Set(cats.flatMap(c=>OTDB_MAP[c]||[]));if(!allowed.size)return[];
  const mapped=cats.filter(c=>OTDB_MAP[c]),single=mapped.length===1?OTDB_ID[mapped[0]]:null;
  const used=usedSet(),out=[];let token=null;try{token=await otdbToken(false)}catch(e){}
  for(let i=0;i<4&&out.length<need;i++){
    if(i)await new Promise(r=>setTimeout(r,5300)); // the API allows one request every 5 seconds
    const url="https://opentdb.com/api.php?amount=50&type=multiple"+(single?"&category="+single:"")+(diff&&diff!=="any"?"&difficulty="+diff:"")+(token?"&token="+token:"");
    const j=await fetch(url).then(r=>r.json());
    if(j.response_code===3||j.response_code===4){try{token=await otdbToken(true)}catch(e){token=null}continue}
    if(j.response_code!==0)continue;
    (j.results||[]).forEach(r=>{
      if(!allowed.has(r.category))return;
      const q=decodeHTML(r.question);if(used.has(q)||out.some(x=>x.en[0]===q))return;
      out.push({cat:mapped.find(c=>OTDB_MAP[c].includes(r.category)),en:[q,decodeHTML(r.correct_answer),...r.incorrect_answers.map(decodeHTML)],fr:null});
    });
  }
  return out;
}

  if(noTr(text))return text;

  const em=(lsGet("qn_mm_email")||"").trim();
  const url="https://api.mymemory.translated.net/get?langpair=en%7Cfr&q="+encodeURIComponent(text.slice(0,450))+(em?"&de="+encodeURIComponent(em):"");

  if(!needFr()||!room.questions||trBlocked)return;
  for(let i=room.qIndex||0;i<Math.min(room.questions.length,(room.qIndex||0)+4);i++){
    const q=room.questions[i],key=room.gameNo+":"+i;
    if(!q||q.fq||trQueued.has(key))continue;
    trQueued.add(key);
    trChain=trChain.then(()=>trQuestion(q)).then(()=>{if(room&&room.questions&&room.questions[i]===q&&q.fq&&i===room.qIndex)changed()}).catch(()=>{});
  }
}
function startHost(resume){

  role="host";

  if(saved){room=saved.room;P=saved.P||{};Object.values(P).forEach(p=>{p.online=false;p.conn=null});if(room.hostPlays&&P.host){P.host.local=true;P.host.online=true}}
  else{room=newRoom();P={}}

function openHostPeer(tries,fresh){
  hostLive=false;
  hostPeer=new Peer(PREFIX+room.code);
  hostPeer.on("open",()=>{hostLive=true;render()});
  hostPeer.on("connection",c=>{
    c.on("data",d=>onHostData(c,d));
    c.on("close",()=>{for(const id in P){if(P[id].conn===c){P[id].conn=null;P[id].online=isOn(P[id]);changed()}}});
  });
  hostPeer.on("disconnected",()=>{hostLive=false;render();setTimeout(()=>{try{if(hostPeer&&!hostPeer.destroyed)hostPeer.reconnect()}catch(e){}},1500)});
  hostPeer.on("error",e=>{
    if(e.type==="unavailable-id"){hostPeer.destroy();
      if(fresh){room.code=genCode();hostRelayStart();openHostPeer(0,true)}
      else if(tries<10)setTimeout(()=>openHostPeer(tries+1,false),3000);
      else{hostLive=true;toast(t("relayBusy"))}
      render();return}
    if(["network","server-error","socket-error","socket-closed"].includes(e.type)){hostLive=false;render()}
  });
}
function requestWake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(role==="host"&&document.visibilityState==="visible")requestWake()});

function onHostData(c,d){
  if(!d||typeof d!=="object"||!room)return;
  const id=String(d.id||"").slice(0,40);if(!id)return;
  const L=d.lang==="fr"?"fr":"en";
  if(d.t==="join"){
    const name=String(d.name||"Player").trim().slice(0,16)||"Player";
    const p=P[id]||(P[id]={name,joinedAt:Date.now(),answers:{},conn:null});
    const wasOn=p.online,oldName=p.name,oldL=p.lang;p.name=name;p.lang=L;
    if(c)p.conn=c;else p.mqSeen=Date.now();
    p.online=true;
    if(!wasOn||oldName!==name||oldL!==L||c)changed();else relayPub(hostRelay,TOPIC+room.code+"/down",{t:"state",s:S});
    return;
  }
  if(!P[id])return;
  if(c)P[id].conn=c;else P[id].mqSeen=Date.now();
  let dirty=false;
  if(!P[id].online){P[id].online=true;dirty=true}
  if(d.lang&&P[id].lang!==L){P[id].lang=L;dirty=true}
  if(d.t==="ans"){
    const k=qk();
    if(room.status==="question"&&!room.paused&&d.k===k&&(room.alive||[]).includes(id)&&!P[id].answers[k]){
      const n=room.questions[room.qIndex].o.length,ci=d.c|0;
      if(ci>=0&&ci<n){P[id].answers[k]={c:ci,ms:Math.max(0,Math.min(+d.ms||0,room.timer*1000))};dirty=true}
    }
  }
  if(dirty)changed();
}
function qk(){return `g${room.gameNo}q${room.qIndex}`}
function pub(){
  const reveal=room.status==="reveal"||room.status==="done";
  const q=room.questions&&room.questions[room.qIndex],k=qk();
  return{seq:++seq,epoch,code:room.code,status:room.status,mode:room.mode,timer:room.timer,k,qIndex:room.qIndex||0,round:room.round||0,mainCount:room.mainCount||0,phase:room.phase,tb:room.tb||0,
    q:q?{q:q.q,o:q.o,fq:q.fq||null,fo:q.fo||null,mt:!!q.mt,cat:q.cat,a:reveal?q.a:null}:null,
    alive:room.alive||[],active:room.active||[],scores:room.scores||{},outRound:room.outRound||{},results:reveal?room.results:null,events:room.events||[],final:!!room.final,winners:room.winners||null,
    players:Object.fromEntries(Object.entries(P).map(([id,p])=>[id,{n:p.name,on:!!p.online,j:p.joinedAt,l:p.lang||"en"}])),
    roundQ:room.roundQ||1,elimRound:room.elimRound||1,bench:room.bench||[],paused:!!room.paused,pausedLeft:room.pausedLeft||0,resumeId:room.resumeId||0,leftAtResume:room.leftAtResume||0,answered:room.status==="question"?(room.alive||[]).filter(id=>P[id]&&P[id].answers[k]):[],duelPick:room.duelPick||[],gameNo:room.gameNo,auto:!!room.auto};
}
function changed(){
  S=pub();
  try{lsSet("qn_host",JSON.stringify({room,P:Object.fromEntries(Object.entries(P).map(([id,p])=>[id,{name:p.name,joinedAt:p.joinedAt,answers:p.answers,lang:p.lang}])),at:Date.now()}))}catch(e){}
  for(const id in P){const c=P[id].conn;if(c&&c.open){try{c.send({t:"state",s:S})}catch(e){}}}
  relayPub(hostRelay,TOPIC+room.code+"/down",{t:"state",s:S});
  hostTick();render();
}
function set(patch){Object.assign(room,patch);changed()}
function togglePause(){
  if(room.status!=="question"&&room.status!=="reveal")return;
  clearTimeout(hostT.q);clearTimeout(hostT.e);clearTimeout(hostT.r);hostT.qKey=hostT.eKey=hostT.rKey=null;
  if(!room.paused){set({paused:true,pausedLeft:room.status==="question"?hostTimeLeft():0})}
  else{const left=room.pausedLeft||0;
    set({paused:false,qStartedAt:room.status==="question"?Date.now()-(room.timer*1000-left):room.qStartedAt,resumeId:(room.resumeId||0)+1,leftAtResume:left})}
}
function hostTick(){
  if(room.status==="question"||room.status==="reveal")translateAhead();
  if(room.paused)return;
  const k=qk();
  if(room.status==="question"){
    if(hostT.qKey!==k){clearTimeout(hostT.q);hostT.qKey=k;hostT.q=setTimeout(()=>closeQ(k),Math.max(0,room.qStartedAt+room.timer*1000+1200-Date.now()))}
    const alive=room.alive||[];
    if(alive.length&&alive.every(id=>P[id]&&P[id].answers[k])&&hostT.eKey!==k){hostT.eKey=k;hostT.e=setTimeout(()=>closeQ(k),900)}
  }
  if(room.status==="reveal"&&room.auto&&!room.final&&hostT.rKey!==k){clearTimeout(hostT.r);hostT.rKey=k;hostT.r=setTimeout(()=>{if(room.status==="reveal"&&qk()===k)nextQ()},8000)}
}
// custom lines: "question | right | wrong | wrong | wrong", optionally followed by "|| French version"
function parseCustom(txt){
  return String(txt||"").split("\n").map(line=>{
    const [a,b]=line.split("||"),sp=x=>String(x||"").split("|").map(s=>s.trim()).filter(Boolean);
    const en=sp(a);if(en.length<3||en.length>5)return null;
    let fr=b!==undefined?sp(b):null;if(fr&&fr.length!==en.length)fr=null;
    return{cat:"Custom",en,fr};
  }).filter(Boolean);
}
function usedSet(){try{return new Set(JSON.parse(lsGet("qn_used")||"[]"))}catch(e){return new Set()}}
function markAsked(){const q=room.questions&&room.questions[room.qIndex];if(!q||q.cat==="Custom")return;const u=usedSet();u.add(q.q);lsSet("qn_used",JSON.stringify([...u]))}
function freshCount(){const u=usedSet();return BANK.filter(b=>room.cats.includes(b.cat)&&!u.has(b.en[0])).length}
function buildPool(cats,custom,n,online,diff){
  online=online||[];
  const u=usedSet(),inCats=BANK.filter(b=>cats.includes(b.cat));
  const fresh=shuffle(inCats.filter(b=>!u.has(b.en[0]))),old=shuffle(inCats.filter(b=>u.has(b.en[0]))); // unasked first; repeats only if we run out
  const mixed=diff&&diff!=="any"?[...shuffle(online),...fresh]:shuffle([...online,...fresh]); // a set difficulty favours the rated online questions
  const list=[...parseCustom(custom),...mixed,...old].slice(0,n);
  return list.map(({cat,en,fr})=>{
    const idx=shuffle(en.slice(1).map((_,i)=>i)); // same answer order in both languages
    return{cat,q:en[0],o:idx.map(i=>en[1+i]),fq:fr?fr[0]:null,fo:fr?idx.map(i=>fr[1+i]):null,a:idx.indexOf(0)};
  });
}
function participants(){return Object.entries(P).filter(([,p])=>p.online).sort((a,b)=>a[1].joinedAt-b[1].joinedAt).map(([id])=>id)}
function startProblem(){
  const parts=participants(),m=room.mode;
  if(!room.cats.length&&!parseCustom(room.custom).length)return t("pickCat");
  if(parts.length<1)return t("waitPlayers");
  if(m==="duel"){const pk=room.duelPick.filter(id=>parts.includes(id));if(pk.length!==2)return parts.length<2?t("duelNeeds2"):t("pick2");}
  else if(m!=="classic"&&parts.length<2)return t("needs2",modeName(m));
  return"";
}
async function startGame(){
  if(startProblem()||loadingQs)return;
  const np=participants().length,n=room.mode==="classic"?MAIN+6:room.mode==="elimination"?Math.min(150,ELIM_Q*Math.max(1,np-1)+15):45;let online=[];
  if(room.online!==false&&typeof fetch==="function"){
    loadingQs=true;render();
    try{online=await Promise.race([fetchOnline(room.cats,room.diff||"any",n),new Promise(r=>setTimeout(()=>r(null),16000))])||[]}catch(e){online=[]}
    loadingQs=false;
    if(!online.length&&room.cats.some(c=>OTDB_MAP[c]))toast(t("onlineFail"));
  }
  if(startProblem()){render();return}
  const m=room.mode,parts=participants(),active=m==="duel"?room.duelPick.filter(id=>parts.includes(id)):parts;
  const qs=buildPool(room.cats,room.custom,n,online,room.diff);
  if(needFr()&&qs[0]&&!qs[0].fq){try{await Promise.race([trQuestion(qs[0]),new Promise(r=>setTimeout(r,5000))])}catch(e){}}
  set({status:"question",gameNo:(room.gameNo||0)+1,questions:qs,mainCount:Math.min(MAIN,qs.length),qIndex:0,round:1,qStartedAt:Date.now(),
    active,alive:active.slice(),scores:Object.fromEntries(active.map(id=>[id,0])),outRound:{},results:null,events:[],final:false,winners:null,paused:false,phase:"main",tb:0,roundQ:1,elimRound:1,bench:[],newRound:false});
  markAsked();render();
}
function topOf(ids,sc){const m=Math.max(...ids.map(id=>sc[id]||0));return ids.filter(id=>(sc[id]||0)===m)}
function closeQ(k){
  if(room.status!=="question"||qk()!==k)return;
  const q=room.questions[room.qIndex],dur=room.timer*1000,mode=room.mode;
  const alive=room.alive.slice(),scores={...room.scores},out={...room.outRound},res={},ev=[];
  alive.forEach(id=>{const a=P[id]&&P[id].answers[k];const ok=!!a&&a.c===q.a;const ms=a?a.ms:null;res[id]={c:a?a.c:-1,ok,ms,pts:ok?(mode==="classic"||mode==="elimination"?1:500+Math.round(500*(1-ms/dur))):0}});
  let newAlive=alive,final=false,winners=null,phase=room.phase,tb=room.tb||0,newRound=false;
  const last=room.qIndex+1>=room.questions.length,addPts=()=>alive.forEach(id=>scores[id]=(scores[id]||0)+res[id].pts);
  if(mode==="classic"){
    if(phase==="main"){addPts();
      if(room.qIndex+1>=room.mainCount){const tied=topOf(alive,scores);
        if(tied.length>1&&!last){newAlive=tied;phase="tiebreak";ev.push({k:"tieTop",ids:tied})}
        else{final=true;winners=tied}}
    }else{tb++;Object.values(res).forEach(r=>r.pts=0);
      const ok=alive.filter(id=>res[id].ok).sort((a,b)=>res[a].ms-res[b].ms);
      if(ok.length){final=true;winners=[ok[0]];ev.push({k:"tbWin",id:ok[0]})}
      else if(last||tb>=5){final=true;winners=alive;ev.push({k:"tbShared"})}
      else ev.push({k:"tbAgain"})}
  }else if(mode==="survivor"){addPts();const wrong=alive.filter(id=>!res[id].ok);
    if(wrong.length===alive.length)ev.push({k:"allMiss"});
    else if(wrong.length){newAlive=alive.filter(id=>res[id].ok);wrong.forEach(id=>out[id]=room.round);ev.push({k:"outList",ids:wrong})}
    else ev.push({k:"allSurvived"});
    if(newAlive.length<=1){final=true;winners=newAlive}
    else if(last){final=true;winners=topOf(newAlive,scores);ev.push({k:"outOfQSurv"})}
  }else if(mode==="elimination"){
    let loser=null,bench=room.bench||[];
    if(phase==="main"){addPts();
      if((room.roundQ||1)>=ELIM_Q){
        const low=Math.min(...alive.map(id=>scores[id]||0)),c=alive.filter(id=>(scores[id]||0)===low);
        if(c.length===1)loser=c[0];
        else if(last)loser=c[Math.floor(Math.random()*c.length)];
        else{phase="tiebreak";tb=0;bench=alive.filter(id=>!c.includes(id));newAlive=c;ev.push({k:"elimTie",r:room.elimRound,ids:c,n:low})}
      }else if(last){final=true;winners=topOf(alive,scores);ev.push({k:"outOfQ"})}
    }else{ // sudden death between the players tied for last
      tb++;Object.values(res).forEach(r=>r.pts=0);
      const wrong=alive.filter(id=>!res[id].ok);
      if(wrong.length===1)loser=wrong[0];
      else if(wrong.length===0){const mx=Math.max(...alive.map(id=>res[id].ms)),sl=alive.filter(id=>res[id].ms===mx);if(sl.length===1){loser=sl[0];ev.push({k:"sdSlowest",id:loser})}}
      else if(wrong.length<alive.length){const safe=alive.filter(id=>res[id].ok);bench=bench.concat(safe);newAlive=wrong;ev.push({k:"sdSafe",ids:safe,ids2:wrong})}
      else ev.push({k:"sdNone"});
      if(!loser&&(last||tb>=6)){loser=newAlive[Math.floor(Math.random()*newAlive.length)];ev.push({k:"coin"})}
    }
    if(loser){
      const rest=bench.concat(alive).filter(id=>id!==loser);
      out[loser]=room.round;ev.push({k:"eliminated",id:loser});bench=[];
      if(rest.length<=1){final=true;winners=rest;newAlive=rest}
      else{newAlive=rest;phase="main";newRound=true;rest.forEach(id=>scores[id]=0);ev.push({k:"newRound",r:room.elimRound+1,n:rest.length})}
    }
    room.bench=bench;
  }else{const ok=alive.filter(id=>res[id].ok).sort((a,b)=>res[a].ms-res[b].ms);alive.forEach(id=>res[id].pts=0);
    if(ok.length){res[ok[0]].pts=1;scores[ok[0]]=(scores[ok[0]]||0)+1;ev.push({k:"point",id:ok[0]})}else ev.push({k:"noPoint"});
    const w=alive.filter(id=>scores[id]>=DUEL_TARGET);if(w.length){final=true;winners=w}else if(last){final=true;winners=topOf(alive,scores)}}
  if(winners&&!winners.length)winners=alive;
  clearTimeout(hostT.q);clearTimeout(hostT.e);
  set({status:"reveal",results:res,events:ev,alive:newAlive,scores,outRound:out,final,winners,phase,tb,newRound});
}
function nextQ(){if(room.status!=="reveal")return;clearTimeout(hostT.r);
  if(room.final){set({status:"done"});return}
  const pat={paused:false,status:"question",qIndex:room.qIndex+1,round:room.round+1,qStartedAt:Date.now(),results:null,events:[]};
  if(room.mode==="elimination"){
    if(room.newRound){pat.roundQ=1;pat.elimRound=(room.elimRound||1)+1;pat.newRound=false;pat.bench=[]}
    else if(room.phase==="main")pat.roundQ=(room.roundQ||1)+1;
  }
  set(pat);markAsked();render()}
function endHost(){
  for(const id in P){try{P[id].conn&&P[id].conn.send({t:"closed"})}catch(e){}}

  Object.values(hostT).forEach(v=>clearTimeout(v));hostT={};lsDel("qn_host");role=null;room=null;P={};S=null;render();
}

function countLabel(txt){const n=parseCustom(txt).length;return n?t("customReady",n):""}
function hostCanPlay(){return !!(!room.paused&&room.hostPlays&&P.host&&(room.alive||[]).includes("host")&&!P.host.answers[qk()])}
// question + answers on the TV, in one or both languages
function tvQ(Q,small){
  const Ls=tvLangs(),main=Ls[0],other=Ls[1];
  const a=qText(Q,main),b=other&&Q.fq?qText(Q,other):null;
  return `<p class="qtext"${small?` style="font-size:clamp(20px,3vw,40px)"`:""}>${esc(a)}</p>${b&&b!==a?`<p class="qalt">${esc(b)}</p>`:""}`;
}
function tvOpt(Q,i){
  const Ls=tvLangs(),a=qOpt(Q,Ls[0],i),b=Ls[1]&&Q.fo?qOpt(Q,Ls[1],i):null;
  return `<span>${esc(a)}</span>${b&&b!==a?`<span class="alt">${esc(b)}</span>`:""}`;
}
function hostQuestion(){
  const left=hostTimeLeft(),L=tvL();nmL=L;
  return `<div class="tv ${tvLangs().length>1&&S.q.fq?"bi":""}">
  <div class="qmeta"><span class="qnum">${qLabel(L)}</span><span class="tag">${tvLangs().map(x=>modeName(S.mode,x)).filter((v,i,a)=>a.indexOf(v)===i).join(" · ")}</span></div>
  <div class="timer"><div class="track"><div class="bar ${left<5000?"low":""}" id="tbar" style="transform:scaleX(${left/(S.timer*1000)})"></div></div><span class="secs" id="tnum">${Math.ceil(left/1000)}</span></div>
  <div class="label">${tvLangs().map(x=>esc(catName(S.q.cat,x))).filter((v,i,a)=>a.indexOf(v)===i).join(" · ")}</div>
  ${S.paused?`<div class="status" style="font-family:var(--display);font-size:clamp(22px,3vw,40px);background:var(--accent);color:var(--accent-ink);border:0">${tvLangs().map(x=>T(x,"paused")).filter((v,i,a)=>a.indexOf(v)===i).join(" · ")}</div>`:""}
  ${tvQ(S.q)}
  <div class="opts">${S.q.o.map((o,i)=>hostCanPlay()?`<button class="opt o${i}" data-act="hans" data-v="${i}"><span class="lt">${"ABCD"[i]}</span>${tvOpt(S.q,i)}</button>`:`<div class="opt o${i}"><span class="lt">${"ABCD"[i]}</span>${tvOpt(S.q,i)}</div>`).join("")}</div>
  <div class="dots">${S.alive.map(id=>`<span class="dot ${S.answered.includes(id)?"in":""}">${esc(nm(id))}</span>`).join("")}</div>
  </div>`;
}
function hostReveal(){
  const L=tvL();nmL=L;
  const r=S.results||{};const pick=i=>Object.entries(r).filter(([,v])=>v.c===i).map(([id])=>nm(id));
  return `<div class="tv ${tvLangs().length>1&&S.q.fq?"bi":""}">
  <div class="qmeta"><span class="qnum">${qLabel(L)}</span><span class="tag">${modeName(S.mode,L)}</span></div>
  ${tvQ(S.q,true)}
  <div class="split">
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="opts">${S.q.o.map((o,i)=>{const p=pick(i);return `<div class="opt o${i} ${i===S.q.a?"right":"dim"}"><span class="lt"><span>${"ABCD"[i]}${i===S.q.a?" ✓":""}</span><span>${p.length}</span></span>${tvOpt(S.q,i)}${p.length&&p.length<=4?`<span class="who">${esc(p.join(", "))}</span>`:""}</div>`}).join("")}</div>
      ${S.events.length?`<ul class="events">${S.events.map(e=>`<li>${tvLangs().map((x,j)=>`<span class="${j?"alt":""}">${esc(evText(e,x))}</span>`).join("")}</li>`).join("")}</ul>`:""}
    </div>
    <div class="panel"><span class="label">${S.final?T(L,"finalStandings"):T(L,"standings")}</span>${boardHTML(true,10,null,L)}</div>
  </div></div>`;
}
function hostDone(){
  const w=S.winners||[],L=tvL();nmL=L;
  return `<div class="tv"><div class="winner"><span class="label">${modeName(S.mode,L)} · ${w.length>1?T(L,"sharedWin"):T(L,"winner")}</span><h2>${esc(names(w)||T(L,"nobody"))}</h2></div>
  <div class="panel"><span class="label">${T(L,"finalStandings")}</span>${boardHTML(false,0,null,L)}</div></div>`;
}
function hostDock(){
  const s=room.status;
  if(s==="lobby"){const p=startProblem();return `<button class="btn line" data-act="end">${t("end")}</button><div class="info">${loadingQs?`<b>${t("loadingQs")}</b>`:p?esc(p):t("readyN",participants().length,modeName(room.mode))}</div><button class="btn hot" data-act="start" ${p||loadingQs?"disabled":""}>${loadingQs?t("loading"):t("start")}</button>`}
  if(s==="question")return `<div class="info">${t("answeredN",S.answered.length,S.alive.length)}${room.hostPlays&&(room.alive||[]).includes("host")?(P.host&&P.host.answers[qk()]?t("youLocked"):t("tapToPlay")):""}</div>${room.paused?"":`<button class="btn line" data-act="close">${t("revealNow")}</button>`}<button class="btn ${room.paused?"hot":"line"}" data-act="pause">${room.paused?t("resume"):t("pause")}</button>`;
  if(s==="reveal")return `<div class="info">${room.paused?`<b>${t("paused")}</b>`:room.final?t("gameOver"):room.auto?t("nextSoon"):t("readyWhen")}</div>${room.final?"":`<button class="btn ${room.paused?"hot":"line"}" data-act="pause">${room.paused?t("resume"):t("pause")}</button>`}<button class="btn hot" data-act="next">${room.final?t("finalResults"):t("nextQ")}</button>`;
  return `<button class="btn line" data-act="end">${t("end")}</button><div class="info">${t("samePlayers")}</div><button class="btn hot" data-act="lobby">${t("backLobby")}</button>`;
}

// ================= PLAYER =================
let pDirect="off",pDiagT=null,pPeer=null,pConn=null,pRelay=[],pCode="",myId=null,myName="",seen={k:null,t:0},picks={},expiredKey=null,connTimer=null,retryT=null,pPulse=null,lastMsg=0;
myId=lsGet("qn_pid");if(!myId){myId="p"+Math.random().toString(36).slice(2,11);lsSet("qn_pid",myId)}
const pLive=()=>!!((pConn&&pConn.open)||Date.now()-lastMsg<12000);

function pSend(obj){
  obj.id=myId;obj.lang=lang;
  if(pConn&&pConn.open){try{pConn.send(obj)}catch(e){}}
  relayPub(pRelay,TOPIC+pCode+"/up",obj);
}
function onPlayerData(d){
  if(!d||role!=="player")return;
  lastMsg=Date.now();
  if(d.t==="state"&&d.s){
    const s=d.s;
    if(S&&s.epoch<S.epoch)return;
    if(S&&s.epoch===S.epoch&&s.seq<=S.seq){render();return}
    S=s;clearTimeout(connTimer);
    if(S.status==="question"&&seen.k!==S.k){seen={k:S.k,t:performance.now(),r:S.resumeId}}
    else if(S.status==="question"&&seen.r!==S.resumeId){seen.t=performance.now()-(S.timer*1000-S.leftAtResume);seen.r=S.resumeId}
    if(!S.players[myId])pSend({t:"join",name:myName});
    render();
  }
  if(d.t==="closed")leavePlayer(["hostEnded"]);
  if(d.t==="kicked"&&d.id===myId)leavePlayer(["kicked"]);
}
function joinAsPlayer(code){
  if(!libsOk()){homeErr=["errLib"];render();return}
  role="player";pCode=code;myName=homeName;S=null;lastMsg=0;lsSet("qn_last",code);render();
  // route 1: relay (works on almost any network)
  pRelay=relayConnect([TOPIC+code+"/down"],onPlayerData);
  pRelay.forEach(c=>c.on("connect",()=>pSend({t:"join",name:myName})));
  clearInterval(pPulse);pPulse=setInterval(()=>{if(role!=="player")return;pSend({t:S?"ping":"join",name:myName});render()},5000);
  // route 2: direct phone-to-phone (faster when the network allows it)
  pDirect=window.Peer?"starting":"not loaded";
  if(window.Peer){try{
    pPeer=new Peer();
    pPeer.on("open",()=>{pDirect="looking for room";dial()});
    pPeer.on("disconnected",()=>{pDirect="signal lost";setTimeout(()=>{try{pPeer&&!pPeer.destroyed&&pPeer.reconnect()}catch(e){}},2000)});
    pPeer.on("error",e=>{pDirect="error: "+e.type;if(e.type==="peer-unavailable"){pDirect="room not found";clearTimeout(retryT);retryT=setTimeout(dial,8000)}});
  }catch(e){pDirect="error: "+e.message}}
  clearInterval(pDiagT);pDiagT=setInterval(()=>{if(role==="player"&&!S)render()},1000);
  clearTimeout(connTimer);connTimer=setTimeout(()=>{if(role==="player"&&!S)leavePlayer(["errNoRoom",code])},20000);
}
function dial(){
  if(role!=="player"||!pPeer||pPeer.destroyed)return;
  try{pConn&&pConn.close()}catch(e){}
  pConn=pPeer.connect(PREFIX+pCode,{reliable:true});
  pDirect="connecting to host";
  pConn.on("open",()=>{pDirect="connected";pSend({t:"join",name:myName});render()});
  pConn.on("error",e=>{pDirect="link failed"});
  pConn.on("data",onPlayerData);
  pConn.on("close",()=>{if(role==="player"){pDirect="link closed";render();clearTimeout(retryT);retryT=setTimeout(dial,4000)}});
}
function leavePlayer(msg){
  clearTimeout(connTimer);clearTimeout(retryT);clearInterval(pPulse);clearInterval(pDiagT);role=null;S=null;
  try{pConn&&pConn.close()}catch(e){}try{pPeer&&pPeer.destroy()}catch(e){}pPeer=null;pConn=null;
  relayEnd(pRelay);pRelay=[];
  homeErr=msg||null;render();
}
function pTimeLeft(){return !S?0:S.paused?S.pausedLeft:Math.max(0,S.timer*1000-(performance.now()-seen.t))}
function canAnswer(){return S&&S.status==="question"&&!S.paused&&S.alive.includes(myId)&&picks[S.k]==null&&!S.answered.includes(myId)&&pTimeLeft()>0}
function answer(i){
  if(!canAnswer())return;
  if(!pLive()){toast(t("reconnectTry"));return}
  const ms=Math.round(performance.now()-seen.t),k=S.k;picks[k]=i;render();
  const msg={t:"ans",k,c:i,ms};pSend(msg);
  setTimeout(()=>{if(S&&S.k===k&&S.status==="question"&&!S.answered.includes(myId))pSend({...msg})},1500); // resend once in case it got lost
}

function pHeader(){return `<div class="top"><div class="brand"><div class="bulb">?</div><h1>Quiz Night</h1></div><div class="topr">${langSwitch()}<span class="conn ${pLive()?"":"warn"}">${pLive()?esc(myName)+" · "+esc(pCode):t("reconnecting")}</span></div></div>`}
function diagText(){
  const rOk=pRelay.filter(c=>c.connected).length;
  return `${t("relay")}: ${typeof WebSocket==="function"?t("ofN",rOk,pRelay.length):t("notLoaded")} · ${t("direct")}: ${esc(pDirect)} · v${VERSION}`;
}
function playerScreen(){
  nmL=lang;
  if(!S)return `<div class="wrap">${pHeader()}<div class="status">${t("joiningRoom",esc(pCode))}</div><p class="hint" style="text-align:center">${diagText()}</p></div>`;
  const inGame=S.active.includes(myId),alive=S.alive.includes(myId);
  let h=`<div class="wrap">${pHeader()}`;
  if(S.status==="lobby"){
    h+=`<div class="panel" style="text-align:center;align-items:center"><span class="label">${t("youreIn")}</span><h2 style="font-size:30px">${esc(myName)}</h2><p class="hint">${t("watchTV")}</p></div>
    <div class="panel"><span class="label">${t("upNext",S.timer)}</span><h3 style="font-size:20px">${modeName(S.mode)}</h3><p class="hint">${MODES[lang][S.mode].rules}</p>
    ${S.mode==="duel"&&S.duelPick.includes(myId)?`<span class="tag win" style="align-self:flex-start">${t("youDueling")}</span>`:""}</div>`;
  }else if(S.status==="question"){
    const mine=picks[S.k]!=null?picks[S.k]:(S.answered.includes(myId)?-2:null),left=pTimeLeft();
    let st="";
    if(!alive)st=(S.bench||[]).includes(myId)?t("safeSD"):inGame?t("outWatch"):t("midGame");
    else if(S.paused)st=mine!=null?t("lockedPaused"):t("pausedHang");
    else if(mine!=null)st=t("lockedIn");else if(left<=0)st=t("timesUp");
    h+=`<div class="qmeta"><span class="qnum">${qLabel()}</span>${lang==="fr"&&!S.q.fq?`<span class="tag">${t("enOnly")}</span>`:lang==="fr"&&S.q.mt?`<span class="tag">${t("mtTag")}</span>`:""}</div>
    <div class="timer"><div class="track"><div class="bar ${left<5000?"low":""}" id="tbar" style="transform:scaleX(${left/(S.timer*1000)})"></div></div><span class="secs" id="tnum">${Math.ceil(left/1000)}</span></div>
    <p style="margin:0;font-weight:600">${esc(qText(S.q,lang))}</p>
    <div class="pad">${S.q.o.map((o,i)=>`<button class="opt o${i} ${mine===i?"mine":""} ${mine!=null&&mine!==i?"dim":""}" data-act="ans" data-v="${i}" ${canAnswer()?"":"disabled"}><span class="lt">${"ABCD"[i]}</span><span>${esc(qOpt(S.q,lang,i))}</span></button>`).join("")}</div>
    ${st?`<div class="status">${st}</div>`:""}`;
  }else if(S.status==="reveal"){
    if(S.paused)h+=`<div class="status">${t("pausedByHost")}</div>`;
    const me=S.results&&S.results[myId],rank=standings().indexOf(myId)+1,right=esc(qOpt(S.q,lang,S.q.a));
    if(me){const outNow=(S.mode==="survivor"||S.mode==="elimination")&&(myId in S.outRound);
      if(me.ok)h+=`<div class="verdict good"><span class="label">${t("correct")}</span><span class="big">${S.mode==="duel"?(me.pts?t("pointToYou"):t("rightTooSlow")):"+"+fmtN(me.pts)}</span><span class="hint">${t("answeredIn",fmtS(me.ms))}</span>${outNow?`<span class="err">${t("youreOut")}</span>`:""}</div>`;
      else h+=`<div class="verdict bad"><span class="label">${me.c<0?t("noAnswer"):t("wrong")}</span><span class="big">${outNow?t("youreOut"):t("noPoints")}</span><span class="hint">${t("itWas",right)}</span></div>`;
    }else h+=`<div class="verdict"><span class="label">${t("answer")}</span><span class="big" style="font-size:26px">${right}</span></div>`;
    if(inGame)h+=`<div class="rankline">${t("rankLine",ordinal(rank),fmtN(S.scores[myId]||0)+(S.mode==="duel"?` / ${DUEL_TARGET}`:t("pts")))}</div>`;
    if(S.events.length)h+=`<ul class="events">${S.events.map(e=>`<li>${esc(evText(e))}</li>`).join("")}</ul>`;
  }else if(S.status==="done"){
    const w=S.winners||[],rank=standings().indexOf(myId)+1;
    h+=`<div class="winner"><span class="label">${w.length>1?t("SharedWin"):t("Winner")}</span><h2 style="font-size:36px">${esc(names(w))}</h2>${w.includes(myId)?`<span>${t("thatsYou")}</span>`:""}</div>
    ${inGame?`<div class="rankline">${t("finished",ordinal(rank))}</div>`:""}
    <div class="panel"><span class="label">${t("finalStandings")}</span>${boardHTML(false,0,myId)}</div>`;
  }
  return h+`<button class="ghost" data-act="pleave" style="align-self:center">${t("leaveRoom")}</button><p class="hint" style="text-align:center;font-size:12px">${diagText()}</p></div>`;
}

// ================= HOME =================
let homeName=lsGet("qn_name")||"",homeCode=(new URLSearchParams(location.search).get("room")||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4),homeErr=null;
function homeScreen(){
  let saved=null;try{saved=JSON.parse(lsGet("qn_host")||"null")}catch(e){}
  const canResume=saved&&saved.room&&Date.now()-saved.at<6*3600e3,last=lsGet("qn_last");
  return `<div class="wrap">
  <div class="top"><div class="brand"><div class="bulb">?</div><h1>Quiz Night</h1></div>${langSwitch()}</div>
  <div class="panel">
    <h2 style="font-size:26px">${homeCode?t("invited"):t("joinGame")}</h2>
    <div class="field"><label class="label" for="nm">${t("yourName")}</label><input type="text" id="nm" maxlength="16" autocomplete="nickname" placeholder="${esc(t("namePh"))}" value="${esc(homeName)}"></div>
    <div class="field"><label class="label" for="cd">${t("roomCodeTV")}</label><input type="text" id="cd" class="codein" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${esc(homeCode)}"></div>
    <button class="btn hot" data-act="join">${t("joinRoom")}</button>
    ${last&&!homeCode?`<button class="btn line" data-act="rejoin">${t("rejoin",esc(last))}</button>`:""}
    ${homeErr?`<p class="err">${esc(t(...homeErr))}</p>`:""}
  </div>
  <div class="or">${t("runningQuiz")}</div>
  <div class="panel">
    <p class="hint">${t("hostHint")}</p>
    <button class="btn" data-act="host">${t("hostNew")}</button>
    <p class="hint" style="font-size:12px">${t("versionLine",typeof WebSocket==="function"?t("ready"):t("notLoaded"),window.Peer?t("ready"):t("notLoaded"))}</p>
    ${canResume?`<button class="btn line" data-act="resume">${t("resumeHost",esc(saved.room.code))}</button>`:""}
  </div></div>`;
}

// ================= RENDER / EVENTS =================
function render(){
  document.documentElement.lang=lang==="fr"?"fr-CA":"en";
  const app=$("#app");let dock="";
  if(role==="host"&&room){
    const ae=document.activeElement,keepFocus=!!(ae&&(ae.id==="customQ"||ae.id==="mmEmail"));
    if(room.status==="lobby"&&keepFocus){ // don't wipe the textarea while typing; just refresh the dock
    }else{
      app.innerHTML={lobby:hostLobby,question:hostQuestion,reveal:hostReveal,done:hostDone}[room.status]();
      if(room.status==="lobby"&&$("#qr")&&window.QRCode){try{new QRCode($("#qr"),{text:joinUrl(room.code),width:200,height:200,colorDark:"#0E1016",colorLight:"#FFFFFF"})}catch(e){}}
    }
    dock=hostDock();
  }else if(role==="player")app.innerHTML=playerScreen();
  else app.innerHTML=homeScreen();
  $("#dock").hidden=!dock;$("#dockIn").innerHTML=dock;
}
function doJoin(code){
  homeName=homeName.trim().slice(0,16);
  if(!homeName){homeErr=["errName"];render();return}
  code=(code||homeCode).toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){homeErr=["errCode4"];render();return}
  lsSet("qn_name",homeName);homeErr=null;joinAsPlayer(code);
}
function setLang(L){
  if(L!=="en"&&L!=="fr"||L===lang)return;
  lang=L;lsSet("qn_lang",L);
  if(role==="player")pSend({t:"ping",name:myName});
  if(role==="host"&&P.host){P.host.lang=L;changed()}else render();
}
document.addEventListener("input",e=>{
  if(e.target.id==="nm")homeName=e.target.value;
  if(e.target.id==="cd"){homeCode=e.target.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);e.target.value=homeCode}
  if(e.target.id==="customQ")$("#customCount").textContent=countLabel(e.target.value);
});
document.addEventListener("change",e=>{
  if(e.target.id==="customQ"&&role==="host"){room.custom=e.target.value.slice(0,20000);changed()}
  if(e.target.id==="mmEmail"){lsSet("qn_mm_email",e.target.value.trim().slice(0,120));trBlocked=false}
});
document.addEventListener("toggle",e=>{if(e.target.id==="settings")lsSet("qn_set_open",e.target.open?"1":"0")},true);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="cd"||e.target.id==="nm"))doJoin()});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const v=b.dataset.v,a=b.dataset.act;
  if(a==="lang")setLang(v);
  else if(a==="join")doJoin();
  else if(a==="rejoin")doJoin(lsGet("qn_last"));
  else if(a==="host")startHost(false);
  else if(a==="resume")startHost(true);
  else if(a==="ans")answer(+v);
  else if(a==="pleave")leavePlayer(null);
  else if(role!=="host")return;
  else if(a==="mode")set({mode:v});
  else if(a==="timer")set({timer:+v});
  else if(a==="tvlang")set({tvLang:v});
  else if(a==="cat")set({cats:room.cats.includes(v)?room.cats.filter(x=>x!==v):[...room.cats,v]});
  else if(a==="auto")set({auto:!room.auto});
  else if(a==="hostplay")setHostPlays(!room.hostPlays);
  else if(a==="hans")hostAnswer(+v);
  else if(a==="pause")togglePause();
  else if(a==="online")set({online:room.online===false});
  else if(a==="autofr")set({autoFr:room.autoFr===false});
  else if(a==="diff")set({diff:v});
  else if(a==="pick"){let p=room.duelPick.slice();p=p.includes(v)?p.filter(x=>x!==v):[...p,v].slice(-2);set({duelPick:p})}
  else if(a==="kick"){const p=P[v];if(p){try{p.conn&&p.conn.send({t:"closed"});p.conn&&p.conn.close()}catch(err){}relayPub(hostRelay,TOPIC+room.code+"/down",{t:"kicked",id:v});delete P[v];room.duelPick=room.duelPick.filter(x=>x!==v);changed()}}
  else if(a==="resetused"){if(b.dataset.armed){lsDel("qn_used");toast(t("histCleared"));changed()}else{b.dataset.armed="1";b.textContent=t("tapReset");setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t("resetHist")}},3000)}}
  else if(a==="start")startGame();
  else if(a==="close")closeQ(qk());
  else if(a==="next")nextQ();
  else if(a==="lobby")set({status:"lobby",results:null,events:[],final:false,winners:null});
  else if(a==="end"){if(b.dataset.armed){endHost()}else{b.dataset.armed="1";b.textContent=t("tapEnd");setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t("end")}},3000)}}
});
// countdown ticker
setInterval(()=>{
  if(!S||S.status!=="question")return;
  const dur=S.timer*1000,left=role==="host"?hostTimeLeft():pTimeLeft(),bar=$("#tbar"),num=$("#tnum");
  if(bar){bar.style.transform=`scaleX(${left/dur})`;bar.classList.toggle("low",left<5000)}
  if(num)num.textContent=Math.ceil(left/1000);
  if(role==="player"&&left<=0&&expiredKey!==S.k){expiredKey=S.k;render()}
},100);
window.addEventListener("extras",()=>{if(!role||(role==="host"&&room&&room.status==="lobby"))render()});
window.addEventListener("beforeunload",e=>{if(role==="host"&&room&&room.status!=="lobby"){e.preventDefault();e.returnValue=""}});
render();
</script>
</body>
